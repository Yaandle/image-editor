<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>imagekit</title>
<link rel="stylesheet" href="style.css">
<script>
  // theme bootstrap — before first paint so there's no flash of wrong theme
  document.documentElement.dataset.theme = localStorage.getItem("imagekit_theme") || "dark";
</script>
</head>
<body>
  <header id="topbar">
    <h1>imagekit</h1>
    <div class="toolbar-sep"></div>
    <div id="project-controls">
      <input id="project-name" value="untitled" title="Project name">
      <button id="btn-save">SAVE</button>
      <select id="project-list"><option value="">LOAD…</option></select>
      <button id="btn-new">NEW</button>
    </div>
    <div id="export-controls">
      <button data-export="svg">SVG</button>
      <button data-export="png">PNG</button>
      <button data-export="jpeg">JPEG</button>
      <div class="toolbar-sep"></div>
      <button id="btn-download" title="Export as PNG/JPEG/GIF/SVG, choosing which pages to include">DOWNLOAD</button>
      <div class="toolbar-sep"></div>
      <button id="btn-theme" title="Toggle theme">◐</button>
    </div>
  </header>

  <div id="workspace">
    <aside id="toolbar">
    <button class="tool" data-tool="select" title="Select (V)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3 L19 12 L12 13 L15 20 L12.5 21 L9.5 14 L5 18 Z"/></svg>
    </button>
    <button class="tool" data-tool="rect" title="Rectangle (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="6" width="16" height="12"/></svg>
    </button>
    <button class="tool" data-tool="ellipse" title="Ellipse (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>
    </button>
    <button class="tool" data-tool="line" title="Line (L)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
    </button>
    <button class="tool" data-tool="pen" title="Pen — click points, Enter to finish (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M15 3 L21 9 L9 21 L3 22 L4 16 Z"/></svg>
    </button>
    <button class="tool" data-tool="pencil" title="Pencil — free draw (B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 Q8 12 12 16 T20 6"/></svg>
    </button>
    <button class="tool" data-tool="text" title="Text (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6 H20 M12 6 V19"/></svg>
    </button>
    <button class="tool" data-tool="fill" title="Bucket fill (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 13 L13 3 L21 11 L11 21 Z"/><circle cx="19" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="btn-import" title="Import image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="16"/><circle cx="8" cy="9" r="1.4" fill="currentColor" stroke="none"/><path d="M4 17 L9 11 L13 15 L17 10 L20 16"/></svg>
    </button>
    <input type="file" id="file-input" accept="image/*" hidden>
    <hr>
    <label>Fill
      <div id="fill-color-picker"></div>
      <input type="hidden" id="fill-color" value="#ffde59">
    </label>
    <label>Stroke
      <div id="stroke-color-picker"></div>
      <input type="hidden" id="stroke-color" value="#000000">
    </label>
    <label>Width <input type="number" id="stroke-width" value="2" min="0" max="40"></label>
    <hr>
    <button id="btn-undo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M8 6 L4 10 L8 14"/><path d="M4 10 H14 A6 6 0 0 1 14 22 H10"/></svg>
    </button>
    <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M16 6 L20 10 L16 14"/><path d="M20 10 H10 A6 6 0 0 0 10 22 H14"/></svg>
    </button>
  </aside>

    <main id="canvas-area">
      <div id="page-stack"></div>
      <button id="btn-add-page" class="secondary-action">+ Add Page</button>
    </main>

    <aside id="properties-panel">

      <header class="properties-header">
        <h2>Properties</h2>
        <span class="properties-status">Inspector</span>
        <button id="properties-toggle" title="Toggle panel">▶</button>
      </header>


      <section class="prop-card" id="prop-canvas">

        <div class="prop-card-header">
          <h3>Canvas</h3>
        </div>

        <div class="prop-section">

          <div class="prop-row large-gap">
            <label>
              Width
              <input type="number" id="canvas-width" min="1" max="8000">
            </label>

            <label>
              Height
              <input type="number" id="canvas-height" min="1" max="8000">
            </label>
          </div>


          <label class="prop-checkbox">
            <input type="checkbox" id="canvas-lock-aspect">
            <span>Lock aspect ratio</span>
          </label>

        </div>


        <div class="prop-section">
          <label class="prop-color-row">
            <span>Background</span>
            <div id="bg-color-picker"></div>
            <input type="hidden" id="canvas-background" value="none">
          </label>
        </div>


        <div class="prop-section anchor-section">

          <h4>Anchor Position</h4>

          <div class="anchor-grid" id="canvas-anchor-grid">

            <button data-anchor="nw"></button>
            <button data-anchor="n"></button>
            <button data-anchor="ne"></button>

            <button data-anchor="w"></button>
            <button data-anchor="center"></button>
            <button data-anchor="e"></button>

            <button data-anchor="sw"></button>
            <button data-anchor="s"></button>
            <button data-anchor="se"></button>

          </div>

        </div>


        <button class="primary-action" id="btn-resize-canvas">
          Resize Canvas
        </button>

      </section>



      <section class="prop-card">

        <div class="prop-card-header">
          <h3>Layers</h3>
        </div>


        <button class="secondary-action" id="btn-add-layer">
          + Add Layer
        </button>


        <ul id="layers-list"></ul>

      </section>


    </aside>

  </div>

  <dialog id="download-dialog">
    <form method="dialog" id="download-form">
      <h3>Download</h3>

      <label class="prop-row-vertical">
        File type
        <select id="download-type">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="gif">GIF</option>
          <option value="svg">SVG</option>
        </select>
      </label>

      <div id="download-gif-options">
        <label class="prop-row-vertical">
          Seconds per animated page
          <input type="number" id="download-gif-seconds" value="2.5" min="0.5" max="30" step="0.5">
        </label>
      </div>

      <fieldset id="download-pages">
        <legend>Pages</legend>
      </fieldset>

      <div class="dialog-actions">
        <button type="button" id="download-cancel">Cancel</button>
        <button type="submit" id="download-confirm" class="primary-action">Download</button>
      </div>
    </form>
  </dialog>

  <footer id="statusbar">
    <span id="status-dot" title="Backend connection"></span>
    <span id="status-text">OFFLINE</span>
    <span id="status-hint">V SELECT · R RECT · E ELLIPSE · L LINE · P PEN · B PENCIL · T TEXT · F FILL</span>
  </footer>

  <script src="js/document.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/gifEncoder.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script type="module">
  import { createColorPicker } from './js/colorPicker.js';

  function wire(containerId, inputId) {
    const input = document.getElementById(inputId);
    const swatchContainer = document.getElementById(containerId);

    createColorPicker(swatchContainer, {
      initialColor: input.value === 'none' ? '#ffffff' : input.value,
      onChange: hex => { input.value = hex; },
      onCommit: hex => {
        input.value = hex;
        input.dispatchEvent(new Event('change', { bubbles: true }));
      },
      onNone: () => {
        input.value = 'none';
        input.dispatchEvent(new Event('change', { bubbles: true }));
      },
    });
  }

  wire('fill-color-picker', 'fill-color');
  wire('stroke-color-picker', 'stroke-color');
  wire('bg-color-picker', 'canvas-background');
  </script>
</body>
</html>
